name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-windows-executable:
    name: Build & Package Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller
      - name: Build Standalone Executable with PyInstaller
        run: |
          python build_windows.py

      - name: Package Distribution Zip & Checksum
        shell: pwsh
        run: |
          $DistDir = "dist/LoL-Remote-Pick"
          $ZipName = "LoL-Remote-Pick-windows-x64.zip"
          Compress-Archive -Path "$DistDir\*" -DestinationPath $ZipName -CompressionLevel Optimal
          
          # Generate SHA256 checksum
          $Hash = (Get-FileHash -Path $ZipName -Algorithm SHA256).Hash
          "$Hash  $ZipName" | Out-File -FilePath "$ZipName.sha256" -Encoding utf8
          
          Write-Host "Created $ZipName (SHA256: $Hash)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          name: "LoL Remote Pick ${{ github.ref_name || inputs.tag_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            LoL-Remote-Pick-windows-x64.zip
            LoL-Remote-Pick-windows-x64.zip.sha256
