name: 🐛 Bug Report
description: Report an issue, bug, or unexpected behavior in LoL Remote Pick
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and resolve the problem.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: When I accept a match from mobile, ...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Start League of Legends on PC
        2. Launch LoL Remote Pick (`start.bat`)
        3. Scan QR code from smartphone
        4. Join queue and click Accept...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen vs what actually happened?
    validations:
      required: true

  - type: dropdown
    id: phase
    attributes:
      label: Game Phase
      description: In which League of Legends phase did the issue occur?
      options:
        - Standby / Disconnected
        - Lobby (Queue selection / Role assignment)
        - In Queue (Searching for match)
        - Ready Check (Match found)
        - Champion Select (Pick / Ban / Spells)
        - In Game / Post Game
        - Network / QR Connection
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: OS version, mobile phone model, and browser.
      placeholder: Windows 11 64-bit / iPhone 15 Safari / Samsung Galaxy S23 Chrome
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Server / Console Logs
      description: Paste any error messages or terminal output here.
      render: shell
